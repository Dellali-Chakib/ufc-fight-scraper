name: Update UFC Fighter Database

on:
  schedule:
    # Run every Monday at 3 AM UTC
    - cron: '0 3 * * 1'
  
  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fighter-data-publish
  cancel-in-progress: false

jobs:
  update-database:
    name: Scrape and Update Fighter Data
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Test refresh safeguards
        run: python -m unittest discover -v

      - name: Fetch, validate, and stage fighter refresh
        run: python run_scraper.py

      - name: Check for changes
        id: check_changes
        run: |
          test ! -f collection-success.json || git add collection-success.json
          git diff HEAD --quiet -- ufc_fighters.db output.csv collection-success.json || echo "changes=true" >> $GITHUB_OUTPUT
      
      - name: Commit updated database
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Actions Bot"
          git add ufc_fighters.db output.csv collection-success.json
          git commit -m "🤖 Automated data update - $(date +'%Y-%m-%d')"
          git push
      
      - name: Upload last known publication
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-database
          path: |
            ufc_fighters.db
            output.csv
            collection-success.json
          retention-days: 30
      
      - name: Generate summary
        if: always()
        run: |
          echo "## Workflow Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Completed**: $(date)" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
