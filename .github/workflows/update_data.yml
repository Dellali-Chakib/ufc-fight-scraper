name: Refresh completed UFC events
on:
  schedule:
    - cron: '23 13 * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish validated event updates (requires established baseline)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: fighter-data-publish
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      REQUEST_PUBLISH: ${{ github.event_name == 'schedule' || inputs.publish }}
    steps:
      - name: Preserve manifest bytes during checkout
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run scraper tests
        run: |
          python -m unittest discover -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Collect, validate and optionally publish
        run: |
          $arguments = @('scripts/actions_refresh.py', '--mode', 'event', '--budget', '5400')
          if ($env:REQUEST_PUBLISH -eq 'true') { $arguments += '--publish' }
          python @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: event-refresh-review
          path: |
            actions-refresh-summary.json
            collection-failure.json
            candidates/
          retention-days: 14
